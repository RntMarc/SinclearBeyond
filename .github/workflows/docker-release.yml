name: Build and Publish Docker Image

on:
  # Trigger 1: Läuft los, sobald du auf GitHub einen Release veröffentlichst
  release:
    types: [published]
  
  # Trigger 2: Erlaubt dir, das Image per Knopfdruck im "Actions"-Tab zu bauen
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Erzeugt einen Image-Namen wie ghcr.io/dein-username/dein-repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Notwendige Berechtigungen, um Packages auf GitHub hochzuladen
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Wird von GitHub automatisch bereitgestellt

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Wenn von einem Release getriggert, wird die Versionsnummer als Tag genommen.
          # Wenn manuell getriggert, wird "latest" verwendet.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Nutzt GitHub Actions Cache für schnellere Builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
